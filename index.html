async function syncOnce(){
const rem=rflat(await cget()),old=readLocal(),loc=flat(old),first=!BASE,B=BASE||{},out={},upd={};
if(first){const has=Object.keys(rem).length>0;Object.assign(out,rem);for(const p in loc){if(p in rem)continue;if(!has||/^(orders|users|log)\//.test(p)){out[p]=loc[p];upd[p]=loc[p]}}}
else{for(const p of new Set([...Object.keys(rem),...Object.keys(loc),...Object.keys(B)])){const b=B[p],l=loc[p],r=rem[p];
 if(l===b){if(r!==undefined)out[p]=r}else{if(l!==undefined)out[p]=l;if(l!==r)upd[p]=l===undefined?null:l}}}
const nd=norm(unflat(out)),nf=flat(nd);let info=null;
if(!same(nf,loc)){const ids=new Set((old.orders||[]).map(o=>o.id));localStorage[K]=JSON.stringify(nd);info={newOrders:(nd.orders||[]).filter(o=>!ids.has(o.id))}}
let ok=true;if(Object.keys(upd).length){try{upd._ping=Date.now();await cpatch(upd)}catch(e){ok=false}}
BASE=ok?out:rem;try{localStorage.pl_base=JSON.stringify(BASE)}catch(e){}
if(info)afterChange(info);
if(!ok)throw new Error('push gagal')}
function cloudSync(){if(!cloudOn())return Promise.resolve();if(busy){rq=true;return busy}
busy=(async()=>{try{await resolveCloud();do{rq=false;await syncOnce()}while(rq);badge(true);startStream()}catch(e){badge(false)}finally{busy=null}})();return busy}
function skipRefresh(){return pg==='ajukan'}
function busyUI(){const a=document.activeElement;return!!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))}
function uiRefresh(){if(typeof render!=='function')return;if(busyUI()||skipRefresh()){pend=true;return}pend=false;render()}
function afterChange(info){try{db=load()}catch(e){}
if(info&&info.newOrders&&info.newOrders.length&&typeof me!=='undefined'&&me&&typeof toast==='function')toast('🔔 Pesanan baru: '+info.newOrders.map(o=>o.id).join(', '));
uiRefresh()}
function badge(ok){if(typeof document==='undefined'||!document.body)return;let b=document.getElementById('cloudb');
if(!b){b=document.createElement('div');b.id='cloudb';b.style.cssText='position:fixed;left:8px;bottom:8px;z-index:60;font:11px system-ui,Arial;background:#000b;color:#fff;padding:4px 10px;border-radius:14px;cursor:pointer;max-width:92vw';b.onclick=()=>{cloudSync()};document.body.appendChild(b)}
if(!cloudOn()){b.style.background='#b00020cc';b.textContent='⚠ Cloud belum diatur: data hanya tersimpan di perangkat ini'}
else if(ok){b.style.background='#0a6b3acc';b.textContent='☁ Tersinkron · '+nowStr()}
else{b.style.background='#b26a00cc';b.textContent='⚠ Offline: data aman di perangkat & dikirim otomatis saat online'}}

const b2d=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function cput(o){await resolveCloud();const data=await b2d(o.blob),r=await tf(FU(o.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:o.id,order:o.order,name:o.name,type:o.type,size:o.size,data})},90000);if(!r.ok)throw new Error('upload '+r.status)}
function fup(){try{return new Set(JSON.parse(localStorage.pl_fup||'[]'))}catch(e){return new Set()}}
function fupAdd(id){const s=fup();s.add(id);try{localStorage.pl_fup=JSON.stringify([...s])}catch(e){}}
async function fput(o){await lput(o);if(cloudOn()){await cput(o);fupAdd(o.id)}}
async function fget(id){let r=null;try{r=await lget(id)}catch(e){}if(r)return r;if(!cloudOn())return null;
try{await resolveCloud();const x=await(await tf(FU(id),{},60000)).json();if(!x||!x.data)return null;const blob=await(await fetch(x.data)).blob();r={id:x.id,order:x.order,name:x.name,type:x.type||blob.type||'',size:x.size,blob};try{await lput(r)}catch(e){}return r}catch(e){return null}}
async function fdel(id){await ldel(id);if(cloudOn())try{await resolveCloud();await tf(FU(id),{method:'DELETE'})}catch(e){}}
async function cloudFiles(){if(!cloudOn())return;const S=fup();let ch=false;
for(const o of(readLocal().orders||[]))for(const d of(o.docs||[])){if(S.has(d.id))continue;let r=null;try{r=await lget(d.id)}catch(e){}if(!r)continue;try{await cput(r);fupAdd(d.id)}catch(e){}}}
function cloudStart(){badge(true);if(!cloudOn()){badge(false);return}
cloudSync().then(cloudFiles);

document.addEventListener('visibilitychange',()=>{if(!document.hidden)cloudSync()});
addEventListener('online',()=>cloudSync());addEventListener('focus',()=>cloudSync());

return `<label style="display:block;margin-top:6px">3. Centang dokumen yang akan Anda kirim via WhatsApp</label><div style="margin-top:6px">${s.req.map((r,i)=>cbx('chk',i,r)).join('')}</div>${op.length?`<label style="display:block;margin-top:10px">Opsi tambahan</label><div style="margin-top:6px">${op.map((r,i)=>cbx('opt',i,r)).join('')}</div>`:''}<div class="mut" style="margin:8px 0">Cukup centang, tidak perlu mengetik. Foto/scan dokumen dikirim saat chat WhatsApp.</div><button class="btn gold" onclick="preview()">📝 Buat Teks Pesan</button><div id="pv"></div>`}
function mediaBlock(s){const f=draft,sl=slots(s),mc=db.mediacfg,tot=sl.filter(x=>x.req).length,dn=sl.filter((x,i)=>x.req&&f.files[i]).length,al={'image/*,application/pdf':'Foto & PDF','image/*':'Foto saja','application/pdf':'PDF saja'}[mc.accept]||'Foto/PDF';
return `<div class="bub bot" style="margin:10px 0 6px">⚡ <b>Jalur Media</b> — ${esc(mc.note)}<br><span class="mut">Maks ${mc.maxMB} MB per file · ${al}</span></div><div class="bar"><i style="width:${tot?dn/tot*100:100}%"></i></div><div class="mut" style="margin:4px 0 10px">Dokumen wajib terisi: ${dn}/${tot}</div>
${sl.map((x,i)=>{const fl=f.files[i];return `<div class="slot ${fl?'ok':''}"><div style="flex:1;min-width:0"><b>${esc(x.n)}</b> ${x.req?'<span class="st Baru">wajib</span>':'<span class="st">opsional</span>'}<div class="mut" style="overflow:hidden;text-overflow:ellipsis">${fl?'✔ '+esc(fl.name)+' · '+kb(fl.size):'Belum ada file'}</div></div><div class="acts" style="margin:0;flex:none"><label class="btn sm ${fl?'line':'gold'}" style="cursor:pointer">${fl?'Ganti':'📁 Galeri'}<input type="file" accept="${mc.accept}" hidden onchange="pickF(${i},this)"></label>${fl?`<button class="btn mail sm" onclick="rmF(${i})">✕</button>`:''}</div></div>`}).join('')}
${cur?`<button class="btn gold" onclick="submitMedia()">🚀 Kirim Berkas (Jalur Media)</button>`:`<div class="bub">Masuk dulu agar berkas tersimpan di akun Anda.</div><button class="btn" onclick="go('akun')">Masuk / Daftar</button>`}`}
function pickF(i,inp){const fl=inp.files[0];if(!fl)return;const mc=db.mediacfg;if(!fl.type.startsWith('image/')&&fl.size>mc.maxMB*1048576)return toast('File melebihi '+mc.maxMB+' MB');if(fl.size>20*1048576)return toast('Foto terlalu besar (maks 20 MB)');draft.files[i]=fl;render()}
function rmF(i){delete draft.files[i];render()}
async function submitMedia(){const f=draft,s=db.services.find(x=>x.id===f.svc);if(!f.nama||!f.kota)return toast('Isi nama dan wilayah dulu');const sl=slots(s),miss=sl.filter((x,i)=>x.req&&!f.files[i]).map(x=>x.n);
if(db.mediacfg.requireAll&&miss.length)return toast('Belum lengkap: '+miss[0]+(miss.length>1?' (+'+(miss.length-1)+' lagi)':''));
if(!Object.keys(f.files).length)return toast('Pilih minimal satu file');toast('Mengunggah berkas…');
const id='PL'+Date.now().toString().slice(-7),docs=[],sh=[];
try{for(let i=0;i<sl.length;i++){const fl=f.files[i];if(!fl)continue;const b=await shrink(fl),fid=id+'_'+i;await fput({id:fid,order:id,name:b.name,type:b.type,size:b.size,blob:b});docs.push({slot:sl[i].n,id:fid,name:b.name,size:b.size,type:b.type});sh.push(b)}}catch(e){return toast('Gagal menyimpan berkas, coba lagi')}
db=load();const u=db.users.find(x=>x.u===cur)||{};db.orders.push({id,user:cur,nama:f.nama,hp:u.hp||'',usaha:f.usaha,kota:f.kota,svc:s.name,price:s.price,status:'Baru',jalur:'media',prio:true,docs,need:sl,ts:Date.now(),at:nowStr(),hist:[]});save();
const msg=`*PENGAJUAN PERIZINAN (JALUR MEDIA ⚡) - PRATAMA LEGAL*\nID Pesanan: ${id}\nLayanan: ${s.name}\nNama: ${f.nama}\nNama Usaha: ${f.usaha||'-'}\nWilayah: ${f.kota}\n\nBerkas lengkap (${docs.length} file):\n`+docs.map((d,i)=>(i+1)+'. '+d.slot).join('\n')+`\n\nMohon segera diproses. Terima kasih.`;
draft={mode:'media',_done:{id,msg,svc:s.name,n:docs.length,files:sh}};render()}
function canShareF(d){try{return navigator.canShare&&navigator.canShare({files:d.files})}catch(e){return false}}
function shareF(){const d=draft._done;navigator.share({files:d.files,text:d.msg,title:'Berkas '+d.id}).catch(()=>{})}
function done(){const d=draft._done;return `<div class="card"><div class="ic" style="background:#dff5e6">✅</div><h2 class="serif" style="color:var(--g1)">Berkas tersimpan!</h2><p>Pesanan <b>${esc(d.id)}</b> (${esc(d.svc)}) · ${d.n} file. ${esc(db.mediacfg.eta)}</p><div class="bub bot">Agar admin langsung menerima berkasnya, kirim lewat tombol di bawah (teks sudah siap).</div><div class="acts">${canShareF(d)?`<button class="btn wa" onclick="shareF()">📤 Kirim Berkas ke WhatsApp</button>`:''}<a class="btn wa" target="_blank" href="${walink(db.wa1,d.msg)}">Kabari WA Admin 1</a><a class="btn wa" target="_blank" href="${walink(db.wa2,d.msg)}">WA Admin 2</a><a class="btn mail" href="${mail('Pengajuan Media '+d.id,d.msg)}">Email</a></div><div class="acts"><button class="btn line" onclick="go('pesanan')">Lihat Pesanan</button><button class="btn gold" onclick="draft={};render()">Ajukan Lagi</button></div></div>`}
function preview(){if(!draft.svc)return toast('Pilih layanan dulu');if(!draft.nama||!draft.kota)return toast('Isi nama dan wilayah');const m=buildMsg(),s=db.services.find(x=>x.id===draft.svc);
$('#pv').innerHTML=`<h3 style="margin-top:14px">Pesan siap kirim</h3><textarea id="msg">${esc(m)}</textarea><div class="acts"><a class="btn wa" target="_blank" onclick="sv()" href="${walink(db.wa1,m)}">Kirim WA Admin 1</a><a class="btn wa" target="_blank" onclick="sv()" href="${walink(db.wa2,m)}">Kirim WA Admin 2</a><a class="btn mail" onclick="sv()" href="${mail('Pengajuan '+s.name+' - '+(draft.nama||''),m)}">Kirim Email</a><button class="btn line" onclick="navigator.clipboard.writeText($('#msg').value);toast('Teks disalin')">📋 Salin</button><button class="btn" onclick="sv(1)">💾 Simpan Pesanan</button></div><p class="mut" style="margin-top:8px">${esc(db.formcfg.foot)}</p>`;$('#pv').scrollIntoView({behavior:'smooth'})}
function sv(m){if(!cur){if(m)toast('Masuk dulu untuk menyimpan pesanan');return}if(draft._sid){if(m)toast('Pesanan sudah tersimpan');return}
const s=db.services.find(x=>x.id===draft.svc);db=load();const u=db.users.find(x=>x.u===cur)||{},id='PL'+Date.now().toString().slice(-7);
db.orders.push({id,user:cur,nama:draft.nama,hp:u.hp||'',usaha:draft.usaha,kota:draft.kota,svc:s.name,price:s.price,status:'Baru',jalur:'biasa',chk:s.req.map((r,i)=>({n:r,ok:!!draft.chk[i]})),ts:Date.now(),at:nowStr(),hist:[]});save();draft._sid=id;if(m){toast('Pesanan '+id+' tersimpan');go('pesanan')}}
async function addExtra(oid,inp){const fl=inp.files[0];if(!fl)return;const lb=prompt('Nama dokumen ini (mis. KTP tambahan):',fl.name);if(lb===null)return;toast('Mengunggah…');const b=await shrink(fl),fid=oid+'_x'+Date.now();try{await fput({id:fid,order:oid,name:b.name,type:b.type,size:b.size,blob:b})}catch(e){return toast('Gagal mengunggah, periksa koneksi internet')}db=load();const o=db.orders.find(x=>x.id===oid);(o.docs=o.docs||[]).push({slot:lb||b.name,id:fid,name:b.name,size:b.size,type:b.type});save();toast('Berkas ditambahkan');render()}
function pesanan(){if(!cur)return`<div class="card"><h3>Masuk untuk melihat pesanan</h3><p class="mut">Anda perlu akun untuk memantau status.</p><div class="acts"><button class="btn gold" onclick="go('akun')">Masuk / Daftar</button></div></div>`;
const l=db.orders.filter(o=>o.user===cur).reverse(),S=['Baru','Diproses','Selesai'];
return`<div class="sec" style="margin-top:0"><h2>Pesanan Saya</h2></div>${l.map(o=>{const i=S.indexOf(o.status),md=o.jalur==='media';return`<div class="card" style="margin-bottom:10px"><b>${esc(o.id)}</b> · ${esc(o.svc)} <span class="st ${o.status.replace(/ /g,'')}">${esc(o.status)}</span> <span class="st" style="background:${md?'#b8860b':'#5a7a76'}">${md?'⚡ Media':'💬 Biasa'}</span><div class="mut">${esc(o.at)} · ${esc(o.usaha||'-')}</div><div class="tl">${S.map((s,j)=>`<i class="${j<=i?'d':''}">${s}</i>`).join('')}</div>${o.adminNote?`<div class="bub">📌 Admin: ${esc(o.adminNote)}</div>`:''}${md?`<div class="mut" style="margin-bottom:6px">Berkas: ${(o.docs||[]).map(d=>'✔ '+esc(d.slot)).join(' · ')||'-'}</div>${o.status==='Menunggu Dokumen'?'<div class="bub">Admin menunggu dokumen tambahan Anda.</div>':''}<label class="btn line sm" style="cursor:pointer">➕ Tambah berkas<input type="file" accept="${db.mediacfg.accept}" hidden onchange="addExtra('${o.id}',this)"></label> `:''}<div class="acts"><a class="btn wa sm" target="_blank" href="${walink(db.wa1,'Halo Admin, saya ingin cek status pesanan '+o.id+' ('+o.svc+').')}">Tanya Status</a><a class="btn mail sm" href="${mail('Status Pesanan '+o.id,'Halo Admin, mohon info status pesanan '+o.id+' ('+o.svc+'). Terima kasih.')}">Email</a></div></div>`}).join('')||'<div class="card mut">Belum ada pesanan. <a href="#" onclick="go(\'ajukan\');return false">Ajukan sekarang</a></div>'}`}
function kontak(){const pre=db.kontakTpl;
return`<div class="sec" style="margin-top:0"><h2>Hubungi Kami</h2>${contactBox()}</div><div class="sec"><h2>Teks Chat Siap Kirim</h2>${pre.map(t=>`<div class="card" style="margin-bottom:8px">${esc(t)}<div class="acts"><a class="btn wa sm" target="_blank" href="${walink(db.wa1,t)}">WA 1</a><a class="btn wa sm" target="_blank" href="${walink(db.wa2,t)}">WA 2</a><a class="btn mail sm" href="${mail('Konsultasi Perizinan',t)}">Email</a></div></div>`).join('')}</div>`}
function akun(){if(cur){const u=db.users.find(x=>x.u===cur)||{};return`<div class="card"><div class="ic">👤</div><h2 class="serif" style="color:var(--g1)">${greet()}, ${esc(who())}!</h2><p class="mut">Username: <b>${esc(cur)}</b> · HP: ${esc(u.hp||'-')}</p><div class="acts"><button class="btn" onclick="go('pesanan')">Pesanan Saya</button><button class="btn gold" onclick="go('ajukan')">Ajukan Baru</button><button class="btn mail" onclick="cur='';localStorage.pl_user='';go('home')">Keluar</button></div></div>`}
return`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="card"><h2 class="serif" style="color:var(--g1);margin-bottom:8px">Masuk</h2><label>Username</label><input id="lu"><label>Password</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')login()"><button class="btn" onclick="login()">Masuk</button></div><div class="card"><h2 class="serif" style="color:var(--g1);margin-bottom:8px">Daftar Baru</h2><label>Nama Lengkap</label><input id="rn"><label>No. HP</label><input id="rh" type="tel"><label>Username</label><input id="ru"><label>Password (min 4)</label><input id="rp" type="password"><button class="btn gold" onclick="reg()">Daftar</button></div></div>`}
async function login(){await cloudSync();const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;db=load();const x=db.users.find(a=>a.u===u&&a.pw===p);if(!x)return toast('Username/password salah');cur=u;localStorage.pl_user=u;toast(greet()+', '+x.nama+'!');go('home')}
async function reg(){await cloudSync();const u=$('#ru').value.trim().toLowerCase(),p=$('#rp').value,n=$('#rn').value.trim(),h=$('#rh').value.trim();if(!/^[a-z0-9_]{3,}$/.test(u))return toast('Username min 3 huruf/angka');if(p.length<4||!n)return toast('Lengkapi data');db=load();if(db.users.find(a=>a.u===u)||db.admins[u])return toast('Username sudah dipakai');db.users.push({u,pw:p,nama:n,hp:h,ts:Date.now(),at:nowStr()});save();cur=u;localStorage.pl_user=u;toast('Pendaftaran berhasil, '+n+'!');go('home')}
let clog=[],typing=0;
function toggleChat(){const p=$('#chatp');p.style.display=p.style.display==='block'?'none':'block';chat()}
function botReply(t){t=t.toLowerCase();const m=db.quick.find(x=>x.k.toLowerCase().split(',').some(w=>w.trim()&&t.includes(w.trim())));return m?m.a:db.fallback}
function reply(q,a){clog.push({t:q});typing=1;chat();setTimeout(()=>{clog.push({b:1,t:a,h:q});typing=0;chat()},650)}
function askQ(i){reply(db.quick[i].q,db.quick[i].a)}
function sendC(){const v=$('#cm').value.trim();if(!v)return;$('#cm').value='';reply(v,botReply(v))}
function chat(){const old=($('#cm')||{}).value||'';if(!clog.length)clog=[{b:1,t:db.hello}];
$('#chatp').innerHTML=`<div class="ch"><b>⚡ Balas Cepat Otomatis</b><div style="font-size:12px;color:#bfe0d8">Dijawab otomatis, bisa lanjut ke admin</div></div><div class="cb"><div id="cbody">${clog.map(m=>`<div class="bub ${m.b?'bot':'me'}">${esc(m.t)}</div>${m.b&&m.h?`<div class="acts" style="margin:-2px 0 8px"><a class="btn wa sm" target="_blank" href="${walink(db.wa1,'Halo Admin PRATAMA LEGAL, saya tanya: '+m.h)}">Lanjut WA 1</a><a class="btn wa sm" target="_blank" href="${walink(db.wa2,'Halo Admin PRATAMA LEGAL, saya tanya: '+m.h)}">WA 2</a><a class="btn mail sm" href="${mail('Pertanyaan',m.h)}">Email</a></div>`:''}`).join('')}${typing?'<div class="bub bot mut">mengetik…</div>':''}</div><div class="qch">${db.quick.map((x,i)=>`<button onclick="askQ(${i})">${esc(x.q)}</button>`).join('')}</div><textarea id="cm" style="min-height:54px;font-family:inherit" placeholder="Ketik pertanyaan…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendC()}">${esc(old)}</textarea><div class="acts"><button class="btn sm" onclick="sendC()">Kirim</button><button class="btn wa sm" onclick="cs(1)">WA 1</button><button class="btn wa sm" onclick="cs(2)">WA 2</button><button class="btn mail sm" onclick="cs(3)">Email</button></div></div>`;
const b=$('#cbody');if(b)b.scrollTop=b.scrollHeight}
function cs(n){const t=$('#cm').value||db.tpl;if(n==3)location.href=mail('Konsultasi Perizinan',t);else window.open(walink(n==1?db.wa1:db.wa2,t),'_blank')}
render();
cloudStart();
</script>
</body>
</html>
